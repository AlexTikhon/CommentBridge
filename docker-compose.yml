# Local development database. The application stack is docker-compose.app.yml and the
# disposable test database is docker-compose.test.yml.
#
# The port is published on the loopback interface only, so the database is not
# reachable from other machines on the network. No credential is defined here:
# Compose reads the password from your .env and refuses to start without it.

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: social_comments
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d social_comments']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
